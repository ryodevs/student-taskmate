<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Anggota — TaskMate</title>
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
<main class="wide" id="app" hidden>
  <header class="topbar">
    <h1>TaskMate</h1>
    <div class="topbar-right">
      <span id="who" class="who-label"></span>
      <button class="link" id="logout" type="button">Keluar</button>
    </div>
  </header>

  <section class="section">
    <h2>Kelas Kamu</h2>
    <form id="join-class" class="inline-form">
      <input id="class-code" type="text" placeholder="Masukkan kode kelas…" required maxlength="6">
      <button class="primary" type="submit">Gabung</button>
    </form>
    <p class="msg" id="class-msg" role="alert"></p>
    <div id="class-list" class="card-list"></div>
  </section>

  <section class="section" id="task-section" hidden>
    <div class="section-header">
      <h2>Tugas — <span id="active-class-name"></span></h2>
    </div>
    <div id="task-list" class="task-list"></div>
    <p class="empty" id="task-empty" hidden>Belum ada tugas.</p>
  </section>
</main>
<script type="module" src="/src/anggota.js"></script>
</body>
</html>
