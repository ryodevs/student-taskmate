<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masuk</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="stylesheet" href="/src/style.css">
</head>
<body class="page-auth">
<main>
  <h1 id="title">Masuk ke akun</h1>
  <p class="sub">Pakai akun Google atau email kamu.</p>

  <div id="g-btn"></div>

  <div class="divider">atau</div>

  <form id="email-form" novalidate>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="email" required>
    <label for="password">Kata sandi</label>
    <input id="password" type="password" autocomplete="current-password" required minlength="6">
    <button class="primary" id="submit" type="submit">Masuk</button>
  </form>
  <button class="link" id="toggle" type="button">Belum punya akun? Daftar</button>
  <p class="msg" id="msg" role="alert"></p>
</main>
<script type="module" src="/src/login.js"></script>
</body>
</html>
