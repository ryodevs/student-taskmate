<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Pengurus — TaskMate</title>
<link rel="stylesheet" href="/src/style.css">
</head>
<body class="page-dashboard">

<nav class="navbar">
  <button class="hamburger" id="menu-btn" type="button" aria-label="Menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
  <span class="navbar-title">TaskMate</span>
  <span class="navbar-class" id="navbar-class"></span>
</nav>

<div class="sidebar-backdrop" id="sidebar-backdrop">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-name" id="sidebar-name"></span>
      <button class="sidebar-close" id="sidebar-close" type="button" aria-label="Tutup">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <span class="sidebar-email" id="sidebar-email"></span>
    <div class="sidebar-class-info" id="sidebar-class-info" hidden>
      <span class="sidebar-class-label">Kelas</span>
      <span class="sidebar-class-name" id="sidebar-class-name"></span>
      <span class="sidebar-class-code" id="sidebar-class-code"></span>
    </div>
    <div class="sidebar-spacer"></div>
    <button class="sidebar-logout" id="logout" type="button">Keluar</button>
  </aside>
</div>

<!-- Setup: buat kelas pertama kali -->
<div id="setup" hidden>
  <div class="setup-card">
    <h2>Buat Kelas</h2>
    <p>Buat kelas pertamamu untuk mulai mengelola tugas.</p>
    <form id="create-class">
      <input id="class-name" type="text" placeholder="Nama kelas…" required>
      <button class="primary" type="submit">Buat</button>
    </form>
    <p class="msg" id="class-msg" role="alert"></p>
  </div>
</div>

<!-- Dashboard: tugas full-width -->
<main id="app" hidden>
  <h2 class="page-title" id="greeting"></h2>
  <p class="page-subtitle">Kelola tugas untuk anggota kelas kamu.</p>

  <div class="class-code-banner" hidden id="class-code-banner">
    <span>Kode kelas:</span>
    <code id="class-code-value"></code>
  </div>

  <div class="stats-row" id="stats-row">
    <div class="stat-card">
      <span class="stat-value" id="stat-tasks">0</span>
      <span class="stat-label">Total tugas</span>
    </div>
    <div class="stat-card">
      <span class="stat-value" id="stat-members">0</span>
      <span class="stat-label">Anggota</span>
    </div>
  </div>

  <form id="add-task" class="task-form">
    <input id="task-title" type="text" placeholder="Judul tugas…" required>
    <input id="task-desc" type="text" placeholder="Deskripsi (opsional)">
    <input id="task-deadline" type="datetime-local">
    <select id="task-priority" aria-label="Prioritas">
      <option value="tinggi">Prioritas Tinggi</option>
      <option value="sedang" selected>Prioritas Sedang</option>
      <option value="rendah">Prioritas Rendah</option>
    </select>
    <button class="primary" type="submit">Tambah</button>
  </form>
  <p class="msg dashboard-msg" id="task-msg" role="alert"></p>
  <div id="overdue-banner" hidden></div>
  <div id="task-list" class="task-list"></div>
  <p class="empty" id="task-empty" hidden>Belum ada tugas. Tambah tugas pertamamu!</p>
</main>

<script type="module" src="/src/pengurus.js"></script>
</body>
</html>
