<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pilih peran</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/style.css">
</head>
<body class="page-auth">
<main class="wide" id="app" hidden>
  <h1>Pilih peran</h1>
  <p class="sub">Peran menentukan apa yang bisa kamu lakukan di kelas.</p>

  <div class="roles">
    <button class="role" type="button" data-role="pengurus">
      <strong>Pengurus</strong>
      <small>Anda akan menjadi pengurus kelas dan menambah tugas</small>
    </button>
    <button class="role" type="button" data-role="anggota">
      <strong>Anggota</strong>
      <small>Anda akan menjadi anggota kelas dan melihat tugas</small>
    </button>
  </div>

  <p class="msg" id="msg" role="alert"></p>
  <p class="who">Masuk sebagai <span id="who"></span></p>
  <button class="link" id="logout" type="button">Ganti akun</button>
</main>
<script type="module" src="/src/role.js"></script>
</body>
</html>
